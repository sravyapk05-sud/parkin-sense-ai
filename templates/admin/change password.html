<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password - Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .page-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 120px);
    }

    .password-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: none;
      max-width: 500px;
      width: 100%;
    }

    .card-header {
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      color: white;
      padding: 25px;
      text-align: center;
      border-radius: 15px 15px 0 0 !important;
      border-bottom: none;
    }

    .card-body {
      padding: 30px;
    }

    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 8px;
    }

    .form-control {
      border-radius: 8px;
      border: 1.5px solid #e1e5e9;
      padding: 12px 15px;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: #4361ee;
      box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.15);
    }

    .btn-change {
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s;
      width: 100%;
    }

    .btn-change:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
    }

    .btn-change:disabled {
      background: #6c757d;
      transform: none;
      box-shadow: none;
    }

    .input-icon {
      color: #4361ee;
      margin-right: 8px;
    }

    .alert-message {
      font-size: 0.875rem;
      margin-top: 5px;
      display: block;
    }

    .alert-container {
      max-width: 500px;
      margin: 20px auto;
    }
  </style>
</head>
<body>

  <!-- Main Content -->
  <div class="page-container">
    <div class="password-card card">
      <div class="card-header">
        <h5 class="mb-0"><i class="fas fa-lock me-2"></i>Change Password</h5>
        <p class="mb-0 opacity-75 mt-2">Secure your account with a new password</p>
      </div>

      <div class="card-body">
        <form id="form1" name="form1" method="post" action="/myapp/change_password_post/#about">
          {% csrf_token %}

          <div class="mb-4">
            <label for="current_password" class="form-label">
              <i class="fas fa-key input-icon"></i>Current Password
            </label>
            <input type="password" class="form-control" id="current_password" name="textfield" placeholder="Enter your current password" required>
          </div>

          <div class="mb-4">
            <label for="new_password" class="form-label">
              <i class="fas fa-lock input-icon"></i>New Password
            </label>
            <input type="password" class="form-control" id="new_password" name="textfield2" placeholder="Create a strong password" required>
          </div>

          <div class="mb-4">
            <label for="conform_password" class="form-label">
              <i class="fas fa-lock input-icon"></i>Confirm Password
            </label>
            <input type="password" class="form-control" id="conform_password" name="textfield3" placeholder="Confirm your new password" required onkeyup="validate_password()">
            <span id="wrong_pass_alert" class="alert-message"></span>
          </div>

          <div class="d-grid">
            <button id="create" type="submit" class="btn-change" disabled>
              <i class="fas fa-key me-2"></i>Change Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="container">
    <div class="alert-container">
      {% if messages %}
        {% for message in messages %}
          <div class="alert
            {% if message.tags == 'success' %} alert-success
            {% elif message.tags == 'error' %} alert-danger
            {% elif message.tags == 'warning' %} alert-warning
            {% else %} alert-info {% endif %}
            alert-dismissible fade show" role="alert">
            <i class="fas
              {% if message.tags == 'success' %} fa-check-circle
              {% elif message.tags == 'error' %} fa-exclamation-circle
              {% elif message.tags == 'warning' %} fa-exclamation-triangle
              {% else %} fa-info-circle {% endif %}
              me-2"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Password Validation Script -->
  <script>
    function validate_password() {
      var pass = document.getElementById('new_password').value;
      var confirm_pass = document.getElementById('conform_password').value;
      var alert = document.getElementById('wrong_pass_alert');

      if (pass != confirm_pass) {
        alert.style.color = '#e74c3c';
        alert.innerHTML = '<i class="fas fa-times me-1"></i>Passwords do not match';
        document.getElementById('create').disabled = true;
      } else {
        alert.style.color = '#2ecc71';
        alert.innerHTML = '<i class="fas fa-check me-1"></i>Passwords match';
        document.getElementById('create').disabled = false;
      }
    }

    // Initialize validation on page load
    document.addEventListener('DOMContentLoaded', function() {
      validate_password();
    });
  </script>

</body>
</html>
{% include "admin/admin_footer.html" %}
