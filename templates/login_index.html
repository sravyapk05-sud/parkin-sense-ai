<!DOCTYPE html>
<html lang="en">

<head>
    <title>D-Diagnosis - Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="Medical Login, Healthcare, Doctor Portal, Diagnosis System" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #4cc9f0;
            --success-color: #2ecc71;
            --light-bg: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px; /* ബോർഡർ റേഡിയസ് കൂട്ടി */
            padding: 50px 45px; /* പാഡിംഗ് കൂട്ടി */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            min-height: 450px; /* ഉയരം കൂട്ടി */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px; /* മാർജിൻ കൂട്ടി */
        }

        .logo {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            width: 100px; /* വീതി കൂട്ടി */
            height: 100px; /* ഉയരം കൂട്ടി */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 12px 25px rgba(67, 97, 238, 0.4);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo i {
            font-size: 2.5rem; /* ഐക്കൺ സൈസ് കൂട്ടി */
            color: white;
        }

        .logo-section h1 {
            color: var(--secondary-color);
            font-weight: 800; /* ഫോണ്ട് വെയിറ്റ് കൂട്ടി */
            font-size: 2.2rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: #666;
            font-size: 1.1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 30px; /* മാർജിൻ കൂട്ടി */
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 12px; /* മാർജിൻ കൂട്ടി */
            color: var(--secondary-color);
            font-weight: 700; /* ഫോണ്ട് വെയിറ്റ് കൂട്ടി */
            font-size: 1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 20px; /* പാഡിംഗ് കൂട്ടി */
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            z-index: 2;
            font-size: 1.2rem; /* ഐക്കൺ സൈസ് കൂട്ടി */
        }

        .form-control {
            width: 100%;
            padding: 18px 18px 18px 55px; /* പാഡിംഗ് കൂട്ടി */
            border: 2.5px solid #e9ecef; /* ബോർഡർ കൂട്ടി */
            border-radius: 15px; /* ബോർഡർ റേഡിയസ് കൂട്ടി */
            font-size: 1.1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            transition: all 0.3s ease;
            background: #fff;
            height: 60px; /* ഉയരം കൂട്ടി */
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
            outline: none;
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 18px; /* പാഡിംഗ് കൂട്ടി */
            border-radius: 15px; /* ബോർഡർ റേഡിയസ് കൂട്ടി */
            font-size: 1.2rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            font-weight: 700; /* ഫോണ്ട് വെയിറ്റ് കൂട്ടി */
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            height: 55px; /* ഉയരം കൂട്ടി */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(67, 97, 238, 0.5);
        }

        .register-section {
            text-align: center;
            margin-top: 35px; /* മാർജിൻ കൂട്ടി */
            padding-top: 25px; /* പാഡിംഗ് കൂട്ടി */
            border-top: 2px solid #eee; /* ബോർഡർ കൂട്ടി */
        }

        .register-section p {
            color: #666;
            margin-bottom: 15px; /* മാർജിൻ കൂട്ടി */
            font-size: 1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            font-weight: 500;
        }

        .register-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 15px 35px; /* പാഡിംഗ് കൂട്ടി */
            border-radius: 12px; /* ബോർഡർ റേഡിയസ് കൂട്ടി */
            font-weight: 700; /* ഫോണ്ട് വെയിറ്റ് കൂട്ടി */
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.4);
            color: white;
            text-decoration: none;
        }

        .message-alert {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 15px 20px; /* പാഡിംഗ് കൂട്ടി */
            border-radius: 12px; /* ബോർഡർ റേഡിയസ് കൂട്ടി */
            margin-bottom: 25px; /* മാർജിൻ കൂട്ടി */
            text-align: center;
            font-weight: 600; /* ഫോണ്ട് വെയിറ്റ് കൂട്ടി */
            animation: shake 0.5s ease-in-out;
            font-size: 1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 40px; /* മാർജിൻ കൂട്ടി */
            text-align: center;
        }

        .feature {
            flex: 1;
            padding: 0 15px; /* പാഡിംഗ് കൂട്ടി */
        }

        .feature i {
            font-size: 1.8rem; /* ഐക്കൺ സൈസ് കൂട്ടി */
            color: var(--primary-color);
            margin-bottom: 10px; /* മാർജിൻ കൂട്ടി */
            transition: transform 0.3s ease;
        }

        .feature:hover i {
            transform: scale(1.2);
        }

        .feature p {
            font-size: 0.9rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            color: #666;
            font-weight: 500;
        }

        footer {
            margin-top: 40px; /* മാർജിൻ കൂട്ടി */
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem; /* ഫോണ്ട് സൈസ് കൂട്ടി */
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                max-width: 450px;
            }

            .login-card {
                padding: 40px 35px;
                min-height: 600px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                max-width: 400px;
            }

            .login-card {
                padding: 35px 30px;
                min-height: 550px;
            }

            .logo {
                width: 85px;
                height: 85px;
            }

            .logo i {
                font-size: 2rem;
            }

            .logo-section h1 {
                font-size: 1.8rem;
            }

            .form-control {
                height: 55px;
                padding: 16px 16px 16px 50px;
            }

            .login-btn {
                height: 60px;
                font-size: 1.1rem;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 24px; /* സൈസ് കൂട്ടി */
            height: 24px; /* സൈസ് കൂട്ടി */
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-stethoscope"></i>
                </div>
                <h1>D-Diagnosis</h1>
                <p>Medical Professional Portal</p>
            </div>

            <!-- Messages -->
            {% for i in messages %}
            <div class="message-alert">
                <i class="fas fa-exclamation-circle me-2"></i>{{ i }}
            </div>
            {% endfor %}

            <!-- Login Form -->
            <form action="/myapp/login_post/" method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" name="textfield" class="form-control" placeholder="Enter your username" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="textfield2" class="form-control" placeholder="Enter your password" required />
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    <span id="buttonText">Login to Dashboard</span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </button>
            </form>

            <!-- Register Section -->
            <div class="register-section">
                <p>New to our platform?</p>
                <a href="/myapp/doctor_signup/" class="register-btn">
                    <i class="fas fa-user-plus me-2"></i>Expert Registration
                </a>
            </div>

            <!-- Features -->
            <div class="features">
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <p>Secure</p>
                </div>
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <p>Fast</p>
                </div>
                <div class="feature">
                    <i class="fas fa-mobile-alt"></i>
                    <p>Responsive</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 D-Diagnosis. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Form submission loading state
        document.querySelector('form').addEventListener('submit', function() {
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            button.disabled = true;
            buttonText.style.display = 'none';
            loadingSpinner.style.display = 'inline-block';
        });

        // Add focus effects
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.parentElement.style.transform = 'translateY(-3px)';
            });

            input.addEventListener('blur', function() {
                this.parentElement.parentElement.style.transform = 'translateY(0)';
            });
        });

        // Add hover effects to features
        const features = document.querySelectorAll('.feature');
        features.forEach(feature => {
            feature.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px)';
            });

            feature.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>

</html>
