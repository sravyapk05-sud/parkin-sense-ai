{% include "doctor/doctor_headers.html" %}
<br><br>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-header text-white text-center py-4" style="background: linear-gradient(135deg, #4361ee, #3a0ca3); border-radius: 20px 20px 0 0;">
                    <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Schedule</h3>
                    <p class="mb-0 mt-2 opacity-75">Update your schedule information</p>
                </div>
                <div class="card-body p-5">
                    <form id="form1" name="form1" method="post" action="/myapp/edit_schedule_post/">
                        {% csrf_token %}
                        <input type="hidden" name="id" value="{{ data.id }}">

                        <div class="mb-4">
                            <label for="schedule_date" class="form-label fw-semibold" style="color: #3a0ca3;">
                                <i class="fas fa-calendar-day me-2"></i>Schedule Date
                            </label>
                            <input type="date" value="{{ data.scheduledate|date:'Y-m-d' }}" name="schedule_date" class="form-control form-control-lg" id="schedule_date" required
                                   style="border-radius: 12px; border: 2px solid #e9ecef; padding: 12px;">
                            <div class="form-text text-muted">
                                Select the updated date for your schedule
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="from_time" class="form-label fw-semibold" style="color: #3a0ca3;">
                                    <i class="fas fa-clock me-2"></i>From Time
                                </label>
                                <input type="time" value="{{ data.fromtime }}" name="from_time" class="form-control form-control-lg" id="from_time" required
                                       style="border-radius: 12px; border: 2px solid #e9ecef; padding: 12px;">
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="to_time" class="form-label fw-semibold" style="color: #3a0ca3;">
                                    <i class="fas fa-clock me-2"></i>To Time
                                </label>
                                <input type="time" value="{{ data.totime }}" name="to_time" class="form-control form-control-lg" id="to_time" required
                                       style="border-radius: 12px; border: 2px solid #e9ecef; padding: 12px;">
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-lg text-white fw-bold py-3"
                                    style="background: linear-gradient(135deg, #4361ee, #3a0ca3); border-radius: 12px;">
                                <i class="fas fa-save me-2"></i>Update Schedule
                            </button>
                            <a href="/myapp/doctor_schedule/" class="btn btn-outline-secondary btn-lg py-3" style="border-radius: 12px;">
                                <i class="fas fa-arrow-left me-2"></i>Back to Schedules
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #4361ee !important;
        box-shadow: 0 0 0 0.3rem rgba(67, 97, 238, 0.15) !important;
    }

    .card {
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .btn {
        transition: all 0.3s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
    }
</style>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function() {
        // Set minimum date to today
        var today = new Date().toISOString().split('T')[0];
        document.getElementById('schedule_date').min = today;

        // Time validation
        document.getElementById('form1').addEventListener('submit', function(e) {
            var fromTime = document.getElementById('from_time').value;
            var toTime = document.getElementById('to_time').value;

            if (fromTime && toTime && fromTime >= toTime) {
                e.preventDefault();
                alert('From time must be earlier than To time');
                return false;
            }
        });
    });
</script>
