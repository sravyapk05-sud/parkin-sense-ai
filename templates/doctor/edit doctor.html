{#<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">#}

{#<body>#}
<form id="form1" name="form1" method="post" action="/myapp/doctor_edit_post/">
    {% csrf_token %}
<table class="table table-bordered">
  <tr>
    <th>Name</th>
    <td>
      <input type="text" class="form-control" required pattern="[a-z/A-Z]*" name="textfield" id="textfield" /></td>
  </tr>
  <tr>
    <th>Email</th>
    <td>
      <input type="email" name="textfield2" class="form-control" required id="textfield2" /></td>
  </tr>
  <tr>
    <th>phone number</th>
    <td>
      <input type="text" name="textfield4" class="form-control" required pattern="[6789][0-9]{9}"   id="textfield4" /></td>
  </tr>
  <tr>
    <th>
      place
      </th>
    <td>
      <input type="text" name="textfield3" class="form-control" required pattern="[a-z/A-Z]*" id="textfield3" /></td>
  </tr>
  <tr>
    <th>Pin</th>
    <td>
      <input type="text" name="textfield5" class="form-control" required pattern="[6][0-9]{5}" id="textfield5" /></td>
  </tr>
  <tr>
    <th>Photo</th>
    <td>
      <input type="text" class="form-control" required  name="textfield6" id="textfield6" /></td>
  </tr>
  <tr>
    <th>Qualification</th>
    <td>
      <input type="text" name="textfield7" class="form-control" required pattern="[a-z/A-Z]*" id="textfield7" /></td>
  </tr>
  <tr>
    <th>Proof</th>
    <td>
      <input type="text" name="textfield8" class="form-control" required  id="textfield8" /></td>
  </tr>
  <tr>
    <td>Post</td>
    <td>
      <input type="text" name="textfield9" class="form-control" required pattern="[a-z/A-Z]*" id="textfield9" /></td>
  </tr>

  <tr align="center">
    <td colspan="2"><input type="submit" class="btn btn-success" name="button" id="button" value="Submit" /></td>
  </tr>
</table>

</form>
{#</body>#}
{#</html>#}
